# Local development:   docker compose up -d db redis      (then: pnpm dev, pnpm worker)
# Full stack locally:  docker compose --profile app up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: searchops
      POSTGRES_PASSWORD: searchops
      POSTGRES_DB: searchops
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchops"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    build: .
    env_file: .env
    environment: &docker-env
      DATABASE_URL: postgresql://searchops:searchops@db:5432/searchops
      REDIS_URL: redis://redis:6379
    command: ["migrate"]
    depends_on:
      db: { condition: service_healthy }

  web:
    profiles: ["app"]
    build: .
    env_file: .env
    environment: *docker-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build: .
    env_file: .env
    environment: *docker-env
    command: ["worker"]
    stop_grace_period: 60s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
